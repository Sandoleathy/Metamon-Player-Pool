[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamon"
version = "1.6.0"
description = "Baselines and Datasets for Pokémon Showdown RL"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Jake Grigsby", email = "grigsby@cs.utexas.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment",
]
keywords = ["pokemon", "reinforcement-learning", "machine-learning"]
dependencies = [
  "gymnasium>=0.26,<=0.29.1",
  "torch>=2.6",
  "numpy",
  "gin-config",
  "wandb",
  "einops",
  "tqdm",
  "lz4",
  "termcolor",
  "rich",
  "huggingface_hub",
  "datasets",
  "ratarmountcore",
  "poke-env @ git+https://github.com/UT-Austin-RPL/poke-env.git",
  "amago @ git+https://github.com/UT-Austin-RPL/amago@v3.4.0",
  "jupyter>=1.1.1",
  "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# pi-python-core needs Python >=3.11; the baseline still supports 3.10, so the
# extra is a no-op there instead of making the whole project uninstallable.
agent = ["pi-python-core>=0.12.0; python_full_version >= '3.11'"]

[tool.uv]
# The poke-env fork pins ``websockets==12.0`` and imports the legacy
# ``websockets.client`` module, which websockets 14 removed. pi-python-core asks
# for ``websockets>=14.2`` but only imports websockets lazily, in its optional
# ChatGPT/Codex WebSocket transport; pi_agent talks to OpenCode Go over HTTP
# (httpx) and never touches that path. Pin the one version poke-env can import.
override-dependencies = ["websockets==12.0"]

[project.urls]
Homepage = "https://metamon.tech"
Repository = "https://github.com/UT-Austin-RPL/metamon"

[tool.setuptools.packages.find]
include = ["metamon*", "pi_agent*"]


[tool.black]
line-length = 88
target-version = ["py310"]
